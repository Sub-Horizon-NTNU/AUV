# Illustrative example only. Replace dimensions, pose and acoustic coefficients with measured data.
# Coordinates: x/y horizontal, z up; floor z=0, water surface z=pool_depth_m.
pool_length_m=10
pool_width_m=5
pool_depth_m=3
sonar_x_m=5
sonar_y_m=2.5
sonar_z_m=1.5
# Right-hand-positive local-to-pool orientation Rz(yaw) Ry(pitch) Rx(roll).
sonar_roll_deg=0
sonar_pitch_deg=0
sonar_yaw_deg=0

sound_speed_m_s=1480
max_range_m=20
transmit_duration_us=20
absorption_per_m=0.01
# R is reflected energy. With roughness/receiver_paths, coherent share S gives R*S
# specular continuation. Diffuse receiver connections use R*(1-S)*B with angular
# and aperture factors; B is backscatter_fraction. Coefficients are uncalibrated.
wall_reflection=0.8
floor_reflection=0.7
surface_reflection=0.95
backscatter_fraction=0.1

# Midpoint quadrature over a uniform 2 degree x 25 degree fan.
horizontal_rays=3
vertical_rays=11
# Receiver-path mode bounds total outbound and return wall contacts.
max_outward_hits=4
range_samples=600

# Optional illustrative scattering approximation. Omit these for legacy surfaces / no particles.
surface_model=roughness
frequency_hz=750000
surface_roughness_m=0.00015
volume_scatterers=1024
volume_seed=42
volume_strength=0.005

# Received geometric paths, not automatic reversal at every contact.
# Effective aperture is illustrative, not a measured Ping360 transducer dimension.
return_model=receiver_paths
receiver_radius_m=0.05
return_reflections=1
