<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">Vision-pipeline for AUV og manipulator</title>
<desc id="desc">Kalibrering og validering før drift. Synkroniserte bilder korrigeres og brukes til stereodybde og objektgjenkjenning. Disse kombineres til 3D-gripepunkt med kvalitetskontroll. Gyldige målinger gir visuell feedback til armen, ellers meldes måletap. SLAM er valgfritt.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597386"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#173248}
.heading{font-size:28px;font-weight:700}.label{font-size:14px;letter-spacing:1px;font-weight:700;fill:#41677b}
.node-title{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#41677b}
.normal{fill:#fff;stroke:#bbccd6;stroke-width:1.5}.setup{fill:#eaf2f6;stroke:#aec6d5;stroke-width:1.5}
.main{fill:#e4f4ed;stroke:#85bca6;stroke-width:1.5}.optional{fill:#f3f6f8;stroke:#a8bbc7;stroke-width:1.5;stroke-dasharray:6 5}
.warning{fill:#fff4e6;stroke:#dbb47a;stroke-width:1.5}
.arrow{fill:none;stroke:#597386;stroke-width:2}.dashed{stroke-dasharray:7 6}
</style></defs>
<rect width="1200" height="1130" fill="#f8fbfd"/>
<text x="50" y="48" class="heading">Vision for AUV og manipulator</text>
<text x="50" y="76" class="small">Foreslått første oppsett: ett stereopar. Arkitektur og modeller er ikke validert på vår rigg.</text>
<text x="50" y="117" class="label">FØR DRIFT</text>
<g><rect x="50" y="135" width="330" height="100" rx="12" class="setup"/><text x="70" y="165" class="node-title">Kalibrer kamera og hus</text><text x="70" y="191" class="body">Intrinsics, dome / flat port</text><text x="70" y="213" class="body">Stereoextrinsics og tidsoppsett</text></g>
<g><rect x="430" y="135" width="330" height="100" rx="12" class="setup"/><text x="450" y="165" class="node-title">Valider på kjente mål</text><text x="450" y="191" class="body">Målefeil over arbeidsområdet</text><text x="450" y="213" class="body">Ved feil: juster optikk / modell</text></g>
<g><rect x="810" y="135" width="340" height="100" rx="12" class="setup"/><text x="830" y="165" class="node-title">Lagre godkjent geometri</text><text x="830" y="191" class="body">Parametere og kalibrerings-ID</text><text x="830" y="213" class="body">Velg validert stereotilnærming</text></g>
<path d="M380 185 H430" class="arrow" marker-end="url(#head)"/><path d="M760 185 H810" class="arrow" marker-end="url(#head)"/>
<text x="50" y="285" class="label">UNDER DRIFT</text>
<g><rect x="50" y="315" width="330" height="100" rx="12" class="normal"/><text x="70" y="345" class="node-title">Synkroniserte bilder</text><text x="70" y="371" class="body">Hardwaretrigger og tidsstempel</text><text x="70" y="393" class="body">Kontroller bildesett og bortfall</text></g>
<g><rect x="440" y="315" width="330" height="100" rx="12" class="normal"/><text x="460" y="345" class="node-title">Optikk og rektifisering</text><text x="460" y="371" class="body">Validert geometri for huset</text><text x="460" y="393" class="body">Konsistent skalering og intrinsics</text></g>
<path d="M380 365 H440" class="arrow" marker-end="url(#head)"/><path d="M980 235 V270 H605 V315" class="arrow dashed" marker-end="url(#head)"/>
<g><rect x="200" y="485" width="350" height="100" rx="12" class="normal"/><text x="220" y="515" class="node-title">Stereodybde</text><text x="220" y="541" class="body">SGM/SGBM → referanse</text><text x="220" y="563" class="body">Light ESS / LightStereo-S → test</text></g>
<g><rect x="650" y="485" width="350" height="100" rx="12" class="normal"/><text x="670" y="515" class="node-title">Objekt / gripepunkt i bildet</text><text x="670" y="541" class="body">Markør, geometri eller liten modell</text><text x="670" y="563" class="body">Samme bildekoordinater som dybde</text></g>
<path d="M605 415 V450 H375 V485" class="arrow" marker-end="url(#head)"/><path d="M605 450 H825 V485" class="arrow" marker-end="url(#head)"/>
<g><rect x="440" y="655" width="330" height="105" rx="12" class="main"/><text x="460" y="685" class="node-title">Objekt og gripepunkt i 3D</text><text x="460" y="711" class="body">Forkast ugyldige dybdepunkter</text><text x="460" y="733" class="body">Tilpass kjent form / gripepunkt</text></g>
<path d="M375 585 V620 H530 V655" class="arrow" marker-end="url(#head)"/><path d="M825 585 V620 H680 V655" class="arrow" marker-end="url(#head)"/>
<g><rect x="50" y="655" width="290" height="105" rx="12" class="optional"/><text x="70" y="685" class="node-title">Valgfri SLAM</text><text x="70" y="711" class="body">Egobevegelse og kart</text><text x="70" y="733" class="body">Egen integrasjonsgren</text></g>
<path d="M460 415 V435 H25 V707 H50" class="arrow dashed" marker-end="url(#head)"/>
<g><rect x="440" y="810" width="330" height="105" rx="12" class="main"/><text x="460" y="840" class="node-title">Kvalitet, sporing og ramme</text><text x="460" y="866" class="body">Fersk måling? Synlig objekt?</text><text x="460" y="888" class="body">Transformer til armens ramme</text></g>
<path d="M605 760 V810" class="arrow" marker-end="url(#head)"/><path d="M195 760 V865 H440" class="arrow dashed" marker-end="url(#head)"/>
<g><rect x="840" y="810" width="310" height="105" rx="12" class="warning"/><text x="860" y="840" class="node-title">Ugyldig måling</text><text x="860" y="866" class="body">Meld måletap til styringen</text><text x="860" y="888" class="body">Ikke bruk gammel pose som fersk</text></g>
<path d="M770 862 H840" class="arrow" marker-end="url(#head)"/>
<text x="785" y="799" class="small">Måletap</text>
<g><rect x="440" y="965" width="330" height="105" rx="12" class="main"/><text x="460" y="995" class="node-title">Visuell feedback til armen</text><text x="460" y="1021" class="body">Gyldig mål → liten bevegelse</text><text x="460" y="1043" class="body">Nytt bilde → ny korreksjon</text></g>
<path d="M605 915 V965" class="arrow" marker-end="url(#head)"/>
<text x="620" y="947" class="small">Gyldig</text>
<path d="M770 1018 H1175 V295 H215 V315" class="arrow" marker-end="url(#head)"/>
<text x="850" y="1000" class="small">Ny observasjon etter bevegelse</text>
<text x="50" y="1105" class="small">18. november 2026 · Heltrukket: hovedflyt · Stiplet: kalibrering / valgfri gren</text>
</svg>
